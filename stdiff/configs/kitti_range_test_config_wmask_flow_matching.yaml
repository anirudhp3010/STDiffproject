# Test config for flow-matching checkpoint (kitti_range_train_config_wmask.yaml with prediction_type='v')
# Use: python ./stdiff/test_stdiff.py --test_config kitti_range_test_config_wmask_flow_matching
Dataset:
    name: 'KITTI_RANGE'
    dir: '/DATA2/common/kitti/processed_data_64x512'
    phase: 'deploy'
    dev_set_size: null
    batch_size: 1
    num_workers: 3
    num_channels: 1
    image_size: [64, 512]
    num_observed_frames: 3
    num_predict_frames: 3
    test_num_observed_frames: 3
    test_num_predict_frames: 3
    rand_Tp: 3
    rand_predict: True
    half_fps: False
    train_folder_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    val_folder_ids: [9]
    test_folder_ids: [1]

STDiff:
    Diffusion:
        prediction_type: 'v'  # Flow matching uses v-prediction
        ddpm_num_steps: 1000
        ddpm_num_inference_steps: 50
        ddpm_beta_schedule: "squaredcos_cap_v2"

        unet_config:
            sample_size: [64, 512]
            in_channels: 5
            out_channels: 2
            m_channels: 256
            layers_per_block: 2
            block_out_channels: [128, 256, 256, 512, 512]
            down_block_types: ["DownBlock2D","AttnDownBlock2D","AttnDownBlock2D", "AttnDownBlock2D", "AttnDownBlock2D"]
            up_block_types: ["AttnUpBlock2D", "AttnUpBlock2D","AttnUpBlock2D", "AttnUpBlock2D", "UpBlock2D"]
            attention_head_dim: [null, 128, 128, 128, 128]

    DiffNet:
        autoregressive: False
        super_res_training: False
        MotionEncoder:
            learn_diff_image: True
            image_size: [64, 512]
            in_channels: 1
            model_channels: 64
            n_downs: 2
        DiffUnet:
            n_layers: 2
            nonlinear: 'tanh'
        Int:
            sde: True
            method: 'euler_heun'
            sde_options:
                noise_type: 'diagonal'
                sde_type: "stratonovich"
                dt: 0.1
                rtol: 1e-3
                atol: 1e-3
                adaptive: False
            ode_options:
                step_size: 0.1
                norm: null

TestCfg:
    # Option A: Pipeline save (stdiff/ at top level) - from pipeline.save_pretrained at end of epoch
    ckpt_path: "/home/anirudh/STDiffProject/STDiff_ckpts/kitti_range_64x512_mask_flow_matching/checkpoint-24600"
    # Option B: Checkpoint save (unet/ or unet_ema/) - use checkpoint-300 for EMA
    # ckpt_path: "/home/anirudh/STDiffProject/STDiff_ckpts/kitti_range_64x512_mask_flow_matching/checkpoint-300"

    test_results_path: "/home/anirudh/STDiffProject/STDiff_ckpts/kitti_range_64x512_mask_flow_matching/test_results_wmask_24600_EulerFlow_50steps"
    gradient_checkpointing: False
    use_xformers: False
    scheduler:
        name: 'EulerFlow'
        sample_steps: 50
        ema: False  # Set True when using checkpoint-300 and want unet_ema

    fps: 1
    metrics: ['PSNR', 'SSIM', 'LPIPS', 'InterLPIPS']
    random_predict:
        first_pred_sample_num: 1
        first_pred_parralle_bs: 1
        sample_num: 1
        fix_init_noise: False

    predict_mask: True
